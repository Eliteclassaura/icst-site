# DEPLOY-PIPE-1.2 (Auditor F-1): third-party actions are pinned to full commit SHAs; this keeps them current, one reviewed PR at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/h2o-setup
      - /.github/actions/h2o-media
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(actions)'
    labels: [dependencies, github-actions]
