name: c0-spike
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: c0_spike }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 3s, retries: 20 }
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "miniodata:/data" ]
  migrate:
    build: .
    command: ["node", "node_modules/payload/bin.js", "migrate"]
    env_file: .env.docker
    depends_on: { db: { condition: service_healthy } }
  web:
    build: .
    ports: [ "3000:3000" ]
    env_file: .env.docker
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: .
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker.ts"]
    env_file: .env.docker
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes: { pgdata: {}, miniodata: {} }
